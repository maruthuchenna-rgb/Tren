<svg width="600" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="candles" width="300" height="200" patternUnits="userSpaceOnUse">
      <!-- Candlestick chart watermark elements -->
      <!-- Candle 1 -->
      <line x1="20" y1="30" x2="20" y2="90" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>
      <rect x="15" y="45" width="10" height="30" rx="1" fill="rgba(255,255,255,0.16)"/>
      
      <!-- Candle 2 -->
      <line x1="45" y1="20" x2="45" y2="110" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
      <rect x="40" y="35" width="10" height="45" rx="1" fill="rgba(255,255,255,0.2)"/>
      
      <!-- Candle 3 -->
      <line x1="70" y1="50" x2="70" y2="120" stroke="rgba(255,255,255,0.14)" stroke-width="1.5"/>
      <rect x="65" y="60" width="10" height="35" rx="1" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>
      
      <!-- Candle 4 -->
      <line x1="95" y1="15" x2="95" y2="85" stroke="rgba(255,255,255,0.16)" stroke-width="1.5"/>
      <rect x="90" y="25" width="10" height="40" rx="1" fill="rgba(255,255,255,0.18)"/>

      <!-- Candle 5 -->
      <line x1="120" y1="40" x2="120" y2="105" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
      <rect x="115" y="50" width="10" height="30" rx="1" fill="rgba(255,255,255,0.16)"/>

      <!-- Candle 6 -->
      <line x1="145" y1="25" x2="145" y2="95" stroke="rgba(255,255,255,0.16)" stroke-width="1.5"/>
      <rect x="140" y="40" width="10" height="35" rx="1" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>

      <!-- Candle 7 -->
      <line x1="170" y1="10" x2="170" y2="70" stroke="rgba(255,255,255,0.17)" stroke-width="1.5"/>
      <rect x="165" y="20" width="10" height="30" rx="1" fill="rgba(255,255,255,0.22)"/>

      <!-- Candle 8 -->
      <line x1="195" y1="35" x2="195" y2="115" stroke="rgba(255,255,255,0.14)" stroke-width="1.5"/>
      <rect x="190" y="45" width="10" height="45" rx="1" fill="rgba(255,255,255,0.17)"/>

      <!-- Candle 9 -->
      <line x1="220" y1="60" x2="220" y2="140" stroke="rgba(255,255,255,0.13)" stroke-width="1.5"/>
      <rect x="215" y="75" width="10" height="40" rx="1" fill="none" stroke="rgba(255,255,255,0.16)" stroke-width="1.5"/>

      <!-- Candle 10 -->
      <line x1="245" y1="40" x2="245" y2="125" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
      <rect x="240" y="55" width="10" height="40" rx="1" fill="rgba(255,255,255,0.19)"/>

      <!-- Candle 11 -->
      <line x1="270" y1="20" x2="270" y2="90" stroke="rgba(255,255,255,0.17)" stroke-width="1.5"/>
      <rect x="265" y="30" width="10" height="35" rx="1" fill="rgba(255,255,255,0.22)"/>

      <!-- Lower row candles -->
      <line x1="30" y1="130" x2="30" y2="185" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
      <rect x="25" y="140" width="10" height="25" rx="1" fill="rgba(255,255,255,0.14)"/>

      <line x1="80" y1="120" x2="80" y2="180" stroke="rgba(255,255,255,0.14)" stroke-width="1.5"/>
      <rect x="75" y="135" width="10" height="30" rx="1" fill="rgba(255,255,255,0.16)"/>

      <line x1="135" y1="110" x2="135" y2="175" stroke="rgba(255,255,255,0.13)" stroke-width="1.5"/>
      <rect x="130" y="125" width="10" height="30" rx="1" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>

      <line x1="185" y1="125" x2="185" y2="190" stroke="rgba(255,255,255,0.14)" stroke-width="1.5"/>
      <rect x="180" y="140" width="10" height="35" rx="1" fill="rgba(255,255,255,0.17)"/>

      <line x1="240" y1="115" x2="240" y2="175" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
      <rect x="235" y="125" width="10" height="30" rx="1" fill="rgba(255,255,255,0.18)"/>

      <!-- Faint dotted trendline -->
      <path d="M 10 70 Q 70 30, 140 60 T 280 20" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" stroke-dasharray="3,3"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#candles)"/>
</svg>